name: Build & Deploy Theme Site

on:
  push:
    branches: [main]
    paths:
      - "**/*.json"
      - "scripts/generate_site.py"
      - ".github/workflows/build-site.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Step 1: splice the theme listing into index.html from the theme JSON files ───
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Splice theme listing into index.html
        env:
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/generate_site.py

      - name: Commit index.html if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged — nothing to commit"
          else
            git commit -m "chore: auto-update theme listing [skip ci]"
            git push
          fi

  # ─── Step 2: deploy the site (index.html + assets) to GitHub Pages ───
  deploy-pages:
    needs: build-and-commit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo (after possible commit)
        uses: actions/checkout@v4
        with:
          ref: main   # pick up the freshly committed index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the whole repo root — index.html (Creator + Browse) + assets
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
